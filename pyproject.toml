[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payshap-ml"
version = "0.1.0"
description = "Real-time fraud detection ML pipeline for PayShap (ISO 20022 pacs.008) instant credit transfers."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Fraud ML Platform Team" }]

dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.3,<5.0",
    "xgboost>=2.0,<3.0",
    "imbalanced-learn>=0.12,<0.13",
    "mlflow>=2.13,<3.0",
    "dvc[s3]>=3.50,<4.0",
    "pyyaml>=6.0,<7.0",
    "fastapi>=0.110,<0.115",
    "uvicorn[standard]>=0.29,<0.31",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "psutil>=5.9,<6.0",
    "httpx>=0.27,<0.28",
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<0.24",
    "black>=24.3,<25.0",
    "ruff>=0.4,<0.5",
    "mypy>=1.9,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
